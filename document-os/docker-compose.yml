# DocumentOS — application stack only (backend + frontend), Dokploy-ready.
# No local Postgres/Redis/nginx: external services via env, Traefik does routing.
# Dokploy → Environment:
#   DATABASE_URL=postgresql+psycopg2://user:pass@host:5432/documentos   (managed Postgres)
#   GEMINI_API_KEY=...  (hosted Gemma 4)   JWT_SECRET=<long-random>
#   REDIS_URL=redis://host:6379/0   (optional — job runner is in-process; reserved)

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      # External managed database (falls back to SQLite on a volume for zero-config runs)
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/documentos.db}
      # Optional / reserved — the generation runner is in-process and needs no Redis
      REDIS_URL: ${REDIS_URL:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef}
      # AI — Gemma 4 via Google AI SDK and/or local Gemma via Ollama
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemma-4-26b-a4b-it}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma3}
      # App
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PROMPTS_DIR: /app/packages/prompts
      EXPORT_DIR: /app/exports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - exports:/app/exports
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # SPA served by a tiny Node static server — Dokploy's Traefik routes:
  #   your-domain/     → frontend:3000
  #   your-domain/api  → backend:8000
  # (configure in Dokploy → Compose → Domains; no nginx involved)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  exports:
  backend-data:
