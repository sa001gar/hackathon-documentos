# DocumentOS — production-ready Docker Compose for Dokploy.
#
# Architecture:
#   Browser → Traefik (Dokploy) → frontend:3000  (docos.sagarkundu.me)
#   Browser → Traefik (Dokploy) → backend:8000   (docos-api.sagarkundu.me)
#   Backend → existing PostgreSQL (managed outside compose)
#
# No nginx, no Caddy, no Apache — Traefik handles routing and TLS.
# No Postgres container — uses the existing Dokploy-managed instance.
# No Redis — generation jobs run in-process.
#
# ── Required (set in Dokploy → Compose → Environment) ────────────
#   DATABASE_URL     postgresql+psycopg2://user:pass@host:5432/documentos
#   JWT_SECRET       any long random string (32+ chars)
#   GEMINI_API_KEY   Google AI Studio API key for Gemma 4
#
# ── Optional ─────────────────────────────────────────────────────
#   AI_PROVIDER      auto | google | ollama | openai | mock   (default: auto)
#   GOOGLE_MODEL     model name override                      (default: gemma-4-26b-a4b-it)
#   OLLAMA_BASE_URL  Ollama server URL                        (default: http://host.docker.internal:11434)
#   GEMMA_MODEL      local Gemma model name                   (default: gemma3)
#   CORS_ORIGINS     comma-separated origins                  (default: https://docos.sagarkundu.me)

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      # Database — managed PostgreSQL (Dokploy). NO SQLite fallback in production.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # AI providers
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemma-4-26b-a4b-it}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma3}
      # CORS — frontend origin(s)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://docos.sagarkundu.me}
      # Paths (container-internal, not configurable)
      PROMPTS_DIR: /app/packages/prompts
      EXPORT_DIR: /app/exports
    volumes:
      - exports:/app/exports
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docos-api.rule=Host(`docos-api.sagarkundu.me`)"
      - "traefik.http.routers.docos-api.entrypoints=websecure"
      - "traefik.http.routers.docos-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.docos-api.loadbalancer.server.port=8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://docos-api.sagarkundu.me}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docos.rule=Host(`docos.sagarkundu.me`)"
      - "traefik.http.routers.docos.entrypoints=websecure"
      - "traefik.http.routers.docos.tls.certresolver=letsencrypt"
      - "traefik.http.services.docos.loadbalancer.server.port=3000"

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  exports:
  backend-data:
